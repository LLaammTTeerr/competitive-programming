[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cf-mcp"
version = "0.1.0"
description = "MCP servers for Codeforces (browse, read statements, submit, track verdicts) and for Polygon (prepare problems: statements, files, tests, packages)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.scripts]
cf-mcp = "cf_mcp.__main__:main"
polygon-mcp = "polygon_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/cf_mcp", "src/polygon_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
