[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cf-mcp"
version = "0.1.0"
description = "MCP server for Codeforces: browse contest problems, read statements, submit solutions, track verdicts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.scripts]
cf-mcp = "cf_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/cf_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
